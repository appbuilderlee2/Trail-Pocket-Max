name: Apply offline preview feature
on:
  push:
    paths:
      - '.preview-bounds-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/preview_patch.py
      - name: Commit changes
        run: |
          git config user.name 'trail-pocket-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.mjs package-manager.mjs unified-ui.mjs unified-ui.css sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'v4.1.10: preview offline package and park bounds'
          git push
