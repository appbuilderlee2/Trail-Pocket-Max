name: Apply geo-anchored offline preview
on:
  push:
    paths:
      - '.preview-geo-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/preview_geo_patch.py
      - name: Commit changes
        run: |
          git config user.name 'trail-pocket-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add map.mjs app.mjs unified-ui.mjs unified-ui.css sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'v4.1.11: anchor offline preview to geographic bounds'
          git push
