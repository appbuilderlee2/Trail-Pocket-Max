name: Import Trail Pocket v4.1.0-r10

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact v4.1.0-r10 source
        run: |
          git clone https://github.com/appbuilderlee2/Trail-Pocket.git /tmp/trail-pocket-source
          cd /tmp/trail-pocket-source
          git checkout cd757be
          rm -rf .git

      - name: Replace target tree except workflows
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/trail-pocket-source/. .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          git checkout HEAD -- .github/workflows/import-v4.1.0-r10.yml

      - name: Commit imported version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Trail Pocket v4.1.0-r10 source tree (cd757be)"
          git push origin HEAD:main
